<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Panzerkampfwagen VI Tiger Ausf. H</title>
    <style>
      :root {
        --ui-fg: #e8e2d4;
        --ui-dim: #9a9384;
        --ui-bg: rgba(18, 17, 15, 0.82);
        --ui-line: rgba(232, 226, 212, 0.18);
        --ui-accent: #c8a54e;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0b0a;
        color: var(--ui-fg);
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
      }
      /* Touch input is read exclusively through pointer events in
         TouchInputProvider; the browser must not also pan/zoom the page. */
      #app {
        position: fixed;
        inset: 0;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0b0b0a;
        z-index: 100;
        transition: opacity 0.4s ease;
        padding: 24px;
        text-align: center;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      #boot h1 {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        margin: 0;
        color: var(--ui-accent);
      }
      #boot p {
        font-size: 11px;
        margin: 0;
        color: var(--ui-dim);
        letter-spacing: 0.06em;
      }
      #boot-bar {
        width: min(280px, 70vw);
        height: 2px;
        background: var(--ui-line);
        overflow: hidden;
      }
      #boot-bar > i {
        display: block;
        height: 100%;
        width: 0%;
        background: var(--ui-accent);
        transition: width 0.25s ease;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">
      <h1>Panzerkampfwagen VI Tiger Ausf.&nbsp;H</h1>
      <p id="boot-status">initialising</p>
      <div id="boot-bar"><i></i></div>
      <p style="font-size: 10px; opacity: 0.5">
        Henschel, late February 1943 &middot; Fgst. Nr. 250050&ndash;250100
      </p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
